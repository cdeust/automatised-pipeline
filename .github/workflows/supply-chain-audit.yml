name: Supply-chain audit

# Issue #66, criterion 6. CodeQL has no Rust analysis, so the language-
# appropriate equivalent is the cargo security toolchain — stated explicitly
# rather than leaving "we skipped CodeQL" as an unexplained gap:
#
#   cargo audit  — RUSTSEC advisories against Cargo.lock (known CVEs)
#   cargo deny   — license policy, duplicate/yanked crates, banned sources
#
# Cron matters more than the PR trigger: a new advisory lands against code
# that has not changed, so inaction is the failure mode and inaction never
# opens a PR. Same reasoning as the marketplace-pin gate (#67).

on:
  pull_request:
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/supply-chain-audit.yml"
  push:
    branches: [main]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
  schedule:
    - cron: "0 6 * * *"   # daily — advisories are published continuously
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit + cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # rust-toolchain.toml pins the channel; this action only installs it.
      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: "1.95.0"

      - name: Install audit tooling
        run: |
          # 0.21 cannot PARSE the current RUSTSEC database: the run on
          # 2026-07-25 died on `RUSTSEC-2026-0109.md` with a TOML parse error,
          # not on a finding. An advisory scanner that fails to read the
          # advisory list is worse than none — it goes red for a reason that
          # has nothing to do with this repo's dependencies.
          cargo install cargo-audit --locked --version ^0.22
          cargo install cargo-deny  --locked --version ^0.20

      # BLOCKING on vulnerabilities only — cargo audit's default exit-1 class.
      # A known-vulnerable dependency in a tool that reads the user's whole
      # source tree is not an advisory matter.
      #
      # `--deny warnings` was tried first and is wrong here: it escalates
      # `unmaintained`/`unsound` to errors, and the first real run went red on
      # three TRANSITIVE advisories (instant, lru via tantivy 0.22; cxx via
      # lbug 0.15) that no PR can fix in-diff — the fix is a major dependency
      # upgrade, tracked as #78. A gate that is permanently red for reasons the
      # contributor cannot act on is a gate everyone learns to skip, which is
      # the failure this whole workflow exists to prevent.
      - name: cargo audit (vulnerabilities — blocking)
        run: cargo audit

      # NON-BLOCKING companion so the warning classes stay VISIBLE rather than
      # silently dropped by the narrower gate above (§14: nothing untreated).
      # Each currently-accepted ID is recorded in deny.toml with a rationale.
      - name: cargo audit (unmaintained/unsound — report only)
        if: always()
        run: cargo audit --deny warnings || true

      - name: cargo deny (licenses, bans, sources, advisories)
        run: cargo deny --all-features check
