name: CI

# Runs on every push to main and every pull request. The Spike B' graph
# accuracy gate lives in tests/graph_accuracy.rs and is part of the standard
# `cargo test` invocation — if any structural EdgeKind F1 regresses below
# the locked floor (nodes ≥ 0.96, Defines ≥ 0.96 as of iteration 5), this
# job fails. As Bugs #11 and #13 land the floor tightens automatically.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege for GITHUB_TOKEN (Scorecard Token-Permissions). CI only
# reads the repository: it checks out, builds and tests. Nothing here writes
# to the repo, publishes a package, or comments on a PR, so a read-only token
# is the whole requirement — an undeclared top-level block would otherwise
# inherit the repository default, which can be read/write.
permissions:
  contents: read

# Cancel in-flight runs when a new commit lands on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: cargo test (graph accuracy gate)
    runs-on: ubuntu-latest
    # A cold build (no cargo cache) compiles tree-sitter + tantivy + lbug
    # from scratch — measured ~19 min just to reach the graph-accuracy gate
    # on run 26515840381, leaving too little of a 25 min budget to also
    # compile + run the full suite. Worse, a timeout is a *cancellation*,
    # and actions/cache skips its save step when cancelled — so every
    # timed-out run failed to warm the cache, guaranteeing the next run was
    # cold too (a self-perpetuating deadlock). 60 min lets one cold build
    # finish and populate the cache; warm-cache runs complete in ~6 min.
    timeout-minutes: 60

    # zstd-sys (pulled transitively via tantivy → tantivy-columnar →
    # tantivy-sstable → zstd → zstd-safe → zstd-sys) and lbug both
    # statically link libzstd, producing duplicate symbols on Linux
    # (rust-lld is strict about this; macOS ld64 silently dedupes,
    # which is why release.yml only needed this on its ubuntu matrix
    # legs). ZSTD_SYS_USE_PKG_CONFIG=1 makes zstd-sys link the system
    # libzstd dynamically instead of compiling its own static copy,
    # eliminating the conflict. See the duplicate-symbol failure on
    # run 26411205432 for the unfixed signature.
    env:
      ZSTD_SYS_USE_PKG_CONFIG: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzstd-dev pkg-config cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          # Required input: `@stable` carried the version in the REF, so
          # pinning the action to a SHA drops it and the action hard-fails
          # with "'toolchain' is a required input". Keep in step with
          # rust-toolchain.toml, which governs local builds.
          toolchain: "1.95.0"

      # Cache the cargo target dir keyed on Cargo.lock. Saves ~minutes per
      # run because tree-sitter + tantivy + lbug are heavy to recompile.
      #
      # The "zstd-pkgconfig-v1" segment is part of the key on purpose:
      # the previous build environment baked a static libzstd.a into
      # target/ that collides with lbug's vendored zstd at link time
      # (see job-level env comment). When that env changes, the cache
      # must NOT be restored — otherwise the conflicting artifact comes
      # back and the link error reappears. Bump this segment whenever
      # the build env changes in a way that touches target/.
      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-zstd-pkgconfig-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-zstd-pkgconfig-v1-

      # The graph_accuracy test is the Spike B' gate. Its asserts ratchet
      # forward as fixes land — current floor is nodes/Defines ≥ 0.96 on
      # tests/fixtures/graph_accuracy/pure-shared/text.py.
      - name: Run graph accuracy gate
        run: cargo test --test graph_accuracy -- --nocapture

      # Full suite (stage3a-d integrations, etc.). Kept separate so a
      # graph-accuracy regression fails the build with a clear signal even
      # if other tests are broken for unrelated reasons.
      # The log is captured because the suite's own tally is the only honest
      # source for the advertised test count — counting `#[test]` attributes
      # undercounts by every test our macros generate (AP #161).
      - name: Run full test suite
        run: set -o pipefail && cargo test 2>&1 | tee test-output.log

      - name: Check generated Codex skills are current
        run: python3 scripts/sync_portable_skills.py --check

      - name: Validate canonical distribution identity
        # Claude's CLI is not installed on GitHub's runner. The actual CLI
        # validation is performed before publishing; CI deterministically
        # validates the same public identity fields and then executes the
        # shipped Claude launcher in the following smoke step.
        run: |
          python3 scripts/check_distribution_identity.py
          python3 scripts/test_plugin_bootstrap.py

      - name: Check distribution launchers with ShellCheck
        run: shellcheck -S warning bin/ensure-binary.sh bin/launch-plugin.sh launch.sh

      - name: Build and start the shipped Codex and Gemini commands
        # cargo install builds this release target for end users. The smoke
        # script reads command + args from both manifests, performs the MCP
        # handshake and calls health_check through the core profile.
        run: |
          cargo build --release --bin ai-architect-mcp-codebase
          PATH="$PWD/target/release:$PATH" python3 scripts/smoke_portable_hosts.py
          CLAUDE_PLUGIN_ROOT="$PWD" python3 scripts/smoke_claude_plugin.py
          python3 scripts/smoke_mcpb.py

      - name: Run pinned OpenAI Codex validators
        # The validators are fetched from immutable commits; PyYAML is the
        # validator's only external import and is exact-version pinned.
        run: |
          python3 -m pip install --disable-pip-version-check PyYAML==6.0.3
          bash scripts/run-codex-validators.sh \
            plugins/ai-architect-mcp-codebase \
            plugins/ai-architect-mcp-codebase/skills/understand-codebase \
            plugins/ai-architect-mcp-codebase/skills/impact-analysis \
            plugins/ai-architect-mcp-codebase/skills/validate-change-plan
        env:
          GH_TOKEN: ${{ github.token }}

      # Static claims (tool names and counts, language count, layout tree) need
      # no run and are checked here too, so a stale README fails the fastest
      # required job rather than waiting on the coverage build.
      - name: Check README claims against the suite and the tool registry
        run: python3 scripts/check_doc_claims.py --test-log test-output.log

  clippy:
    name: cargo clippy (-D warnings, workspace-wide)
    runs-on: ubuntu-latest
    # source: issue #42 — ci.yml ran no clippy job at all, which is why 35+
    # `-D warnings` errors accumulated undetected in the root crate
    # (ai-architect-mcp-codebase). This job closes that gap: every push/PR must be
    # clean under `-D warnings` across every workspace member (root crate +
    # crates/zera + benches/harness), matching the exact command from the
    # issue body so a local `cargo clippy --all-targets -- -D warnings`
    # failure always reproduces here.
    timeout-minutes: 60

    # Same zstd/lbug static-link conflict as the test job — see its env
    # comment above for the root cause.
    env:
      ZSTD_SYS_USE_PKG_CONFIG: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzstd-dev pkg-config cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: "1.95.0"
          components: clippy

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-clippy-zstd-pkgconfig-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-clippy-zstd-pkgconfig-v1-

      - name: Run clippy (workspace, all targets, deny warnings)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all --check

  coverage:
    name: cargo llvm-cov (80% line floor)
    runs-on: ubuntu-latest
    # source: issue #160 — statement coverage was MEASURED (81.59% lines,
    # cargo-llvm-cov 0.8.7, 2026-07-27) but nothing enforced it, so a change
    # dropping it to 74% would have merged green while .bestpractices.json
    # went on answering the OpenSSF silver criterion `test_statement_coverage80`
    # Met on the strength of a hand-run command. A measurement that nothing
    # re-runs is a claim with an expiry date nobody is watching.
    #
    # 80 is not a tuning knob: it is the threshold the OpenSSF criterion names
    # (https://www.bestpractices.dev/en/criteria/1 — test_statement_coverage80).
    # The floor is what the badge answer is allowed to assert, not a target.
    timeout-minutes: 90

    # Same zstd/lbug static-link conflict as the test job — see its env
    # comment above for the root cause.
    env:
      ZSTD_SYS_USE_PKG_CONFIG: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # First, and before anything expensive: a gate whose own logic is broken
      # is worse than no gate, and finding that out after a 90-minute
      # instrumented build wastes the run. Stdlib-only, so it needs no setup.
      - name: Unit tests (doc-claims gate logic, all arms)
        run: |
          python3 -m unittest \
            scripts/tests/test_check_doc_claims.py \
            scripts/tests/test_doc_claim_sources.py -v 2>&1 | tail -5

      - name: Install Linux build deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzstd-dev pkg-config cmake

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: "1.95.0"
          # llvm-tools ships llvm-profdata/llvm-cov, which cargo-llvm-cov
          # drives; without it the run fails at report time, after paying
          # for the whole instrumented build.
          components: llvm-tools-preview

      # ~/.cargo/bin is in the cache path here (unlike the test/clippy jobs)
      # so cargo-llvm-cov is not recompiled on every run; `cargo install`
      # is a no-op when the cached binary already satisfies the version req.
      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-llvmcov-zstd-pkgconfig-v1-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-llvmcov-zstd-pkgconfig-v1-

      # Idempotent by necessity. The cargo cache restores ~/.cargo/bin, so on
      # every run after the first this binary is ALREADY there, and plain
      # `cargo install` treats that as a hard error ("binary `cargo-llvm-cov`
      # already exists in destination", exit 101) rather than as success. That
      # turned a required check into one that passed exactly once — the first
      # run on a cold cache — and failed for every pull request afterwards.
      # Reuse the cached binary when it satisfies the constraint; install only
      # when it does not, so a version bump still takes effect.
      - name: Install cargo-llvm-cov
        run: |
          if cargo llvm-cov --version 2>/dev/null | grep -qE '^cargo-llvm-cov 0\.8\.'; then
            echo "reusing cached $(cargo llvm-cov --version)"
          else
            cargo install cargo-llvm-cov --locked --version '^0.8' --force
          fi

      # Split into run / report / gate so the instrumented suite is executed
      # exactly once: --no-report leaves the profraw data in place, and both
      # the machine-readable export and the human summary are generated from
      # it. Collapsing these would either run the suite twice or leave the
      # doc-claims check with no number to compare against.
      - name: Run instrumented test suite
        run: cargo llvm-cov --workspace --no-report

      - name: Export coverage (machine-readable)
        run: cargo llvm-cov report --json --output-path coverage.json

      - name: Enforce the 80% line floor
        run: cargo llvm-cov report --summary-only --fail-under-lines 80

      # The README badge asserted 81.59% because a human typed it. This step
      # makes the advertised number answerable to the measurement: it fails
      # when the badge overstates what this job just measured.
      - name: Check README coverage claim against the measurement
        run: python3 scripts/check_doc_claims.py --coverage-json coverage.json

      - name: Publish the measured number to the run summary
        if: always()
        run: |
          if [ -f coverage.json ]; then
            python3 scripts/check_doc_claims.py --coverage-json coverage.json \
              --print-coverage >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No coverage.json — the instrumented run did not reach report stage." \
              >> "$GITHUB_STEP_SUMMARY"
          fi
