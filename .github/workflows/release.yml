name: Release binaries

# Triggered when the maintainer pushes a tag matching v*. Builds the
# ai-architect-mcp-codebase binary for the three platforms Cortex's installer
# fast-path knows how to consume (macos-aarch64, linux-x86_64,
# linux-aarch64) plus a windows-x86_64 leg, tarballs each,
# computes a SHA256 companion, and attaches everything to the GitHub
# Release.
#
# macos-x86_64 is intentionally omitted — Apple-silicon dominance
# in 2026 + macos-13 runner deprecation makes the cost/value ratio
# poor. Add back when GitHub provides a native x86_64 runner that
# isn't end-of-lifed, or cross-compile from macos-latest.
#
# Asset naming convention (Cortex installer contract):
#   ai-architect-mcp-codebase-{os}-{arch}.tar.gz
#   ai-architect-mcp-codebase-{os}-{arch}.tar.gz.sha256
#   ai-architect-mcp-codebase-{os}-{arch}.tar.gz.sigstore.json   (provenance)
# where {os} ∈ {macos, linux, windows}, {arch} ∈ {x86_64, aarch64}.
# Every attested asset gets a sibling `.sigstore.json` Sigstore bundle. The
# installer contract ignores it; it exists so the signature is on the release
# page rather than only in GitHub's attestation API (see the staging steps).
# The tar archive root must contain ``ai-architect-mcp-codebase`` (no nested
# dir); the windows archive contains ``ai-architect-mcp-codebase.exe``.
# Cortex's installer contract only consumes the macos/linux assets —
# windows is a direct-download convenience, not part of that contract.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: >-
          Recovery / first-publish path only. Existing release tag to
          (re)publish to the MCP Registry, e.g. v0.9.1. The GitHub Release
          for that tag must already be public (not draft) with the .mcpb
          asset attached — this path does not rebuild or re-release
          anything, it only (re)publishes server.json to the registry.
          Required for workflow_dispatch; the workflow refuses to guess.
        required: false
        type: string

# Least privilege (Scorecard Token-Permissions). The top level is READ-ONLY;
# each job escalates to exactly what it needs, so a job that only builds can
# never be handed a token that can publish. Previously these three writes were
# declared here and inherited by every job.
#
# Per-job escalations below use:
#   contents: write       upload release assets
#   id-token: write       OIDC token Sigstore exchanges for a short-lived cert
#   attestations: write   record the signed provenance statement on the repo
permissions:
  contents: read

jobs:
  # Pre-create the release exactly once before the matrix fans out.
  # Without this, every matrix job races to "create or upload"; the
  # second writer hits HTTP 422 ``already_exists`` finalizing, *and*
  # GitHub silently produces a second untagged-draft release that
  # collects whichever assets the failing job uploaded — they never
  # appear on the published release. Observed on v0.0.4: macOS assets
  # landed on a draft while linux assets landed on the published
  # release, leaving Cortex's installer with no darwin asset.
  create_release:
    name: create release (${{ github.ref_name }})
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Creates the release and uploads notes; no attestation here.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify tag matches the plugin version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "plugin version $VERSION is not stable SemVer" >&2; exit 1; }
          if [ "$TAG" = "v$VERSION" ]; then
            :
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc[0-9]+$ ]] \
            && [ "${BASH_REMATCH[1]}" = "$VERSION" ]; then
            :
          else
            echo "tag $TAG does not match plugin version $VERSION" >&2
            exit 1
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') }}

  build:
    name: build (${{ matrix.target_tag }})
    needs: create_release
    if: github.event_name == 'push'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target_tag: macos-aarch64
            rust_target: aarch64-apple-darwin
            runner: macos-latest
          - target_tag: linux-x86_64
            rust_target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target_tag: linux-aarch64
            rust_target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm  # native ARM runner — no cross
          # Promoted from EXPERIMENTAL to a required leg (#176). It was
          # continue-on-error because the MSVC build of lbug's C++ core was
          # unverified and a breakage should not block the macOS/Linux
          # release. That reasoning inverted once it started failing: with no
          # pre-merge signal AND continue-on-error, v0.8.3 shipped with the
          # windows asset silently missing while the release went green — worse
          # than a blocked release, because nothing announced the loss.
          # windows-build.yml now builds this target on every pull request, so a
          # break is caught before a tag exists and this leg can be required.
          - target_tag: windows-x86_64
            rust_target: x86_64-pc-windows-msvc
            runner: windows-latest
            bin_suffix: .exe
    runs-on: ${{ matrix.runner }}
    # No leg is allowed to fail: every platform in the matrix is now required
    # (#176). Nothing sets `experimental` any more, so the old
    # `continue-on-error: ${{ matrix.experimental == true }}` was dead config
    # that read as if some leg were still exempt.

    # Uploads the platform tarball + sha256 and records signed provenance.
    permissions:
      contents: write
      id-token: write
      attestations: write

    # Git Bash on the windows runner — keeps every run step (mktemp, tar,
    # shasum) identical across all four platforms. No-op on macOS/Linux
    # where bash is already the default shell.
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Linux build deps
        if: startsWith(matrix.runner, 'ubuntu')
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libzstd-dev pkg-config cmake

      # `@stable` was a BRANCH ref: the compiler that built a release was
      # whatever that branch pointed at on the day, so two runs of the same tag
      # could differ and a provenance attestation over it would attest to very
      # little. Action pinned to a SHA; version comes from rust-toolchain.toml,
      # which local builds read too (issue #66).
      - name: Install Rust toolchain (pinned)
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: "1.95.0"
          targets: ${{ matrix.rust_target }}

      - name: Cache cargo registry + target
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ matrix.target_tag }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ matrix.target_tag }}-cargo-

      # lbug 0.18's Kuzu core asks the linker for `ssl` and `crypto` — Unix-style
      # names MSVC resolves to ssl.lib / crypto.lib, filenames no OpenSSL build
      # for Windows ships (the image has libssl.lib / libcrypto.lib). That is
      # what broke the v0.8.3 windows leg with LNK1181 (#176); lbug 0.15, which
      # v0.8.2 built against, did not link OpenSSL at all. Kept byte-identical
      # with the same step in windows-build.yml, which is what proves it works
      # before a tag exists.
      - name: Provide ssl.lib / crypto.lib to the MSVC linker (windows)
        if: startsWith(matrix.runner, 'windows')
        run: |
          set -euo pipefail
          SHIM="$RUNNER_TEMP/openssl-shim"
          mkdir -p "$SHIM"
          for d in \
            "/c/Program Files/OpenSSL/lib/VC/x64/MD" \
            "/c/Program Files/OpenSSL/lib/VC" \
            "/c/Program Files/OpenSSL/lib" \
            "/c/vcpkg/installed/x64-windows/lib"
          do
            if [ -f "$d/libssl.lib" ] && [ -f "$d/libcrypto.lib" ]; then
              cp "$d/libssl.lib" "$SHIM/ssl.lib"
              cp "$d/libcrypto.lib" "$SHIM/crypto.lib"
              echo "shimmed OpenSSL import libs from: $d"
              echo "RUSTFLAGS=-L native=$(cygpath -w "$SHIM")" >> "$GITHUB_ENV"
              exit 0
            fi
          done
          echo "::error::no libssl.lib/libcrypto.lib found in any known location"
          find "/c/Program Files/OpenSSL" -name '*.lib' 2>/dev/null | head -20 || true
          exit 1

      # zstd-sys + lbug both statically link libzstd, producing duplicate
      # symbols on Linux (rust-lld is strict; macOS ld64 silently dedupes).
      # ZSTD_SYS_USE_PKG_CONFIG=1 makes zstd-sys link the system libzstd
      # dynamically, eliminating the conflict. Linux-only: when the var is
      # set, zstd-sys REQUIRES pkg-config (build.rs panics if it is
      # missing), and windows-latest ships without pkg-config — v0.8.0 run
      # 29975233898 failed exactly there. Two steps instead of one env
      # expression so the var is genuinely unset (not "") off-Linux.
      - name: Build (linux — dynamic system libzstd)
        if: startsWith(matrix.runner, 'ubuntu')
        env:
          ZSTD_SYS_USE_PKG_CONFIG: "1"
        run: cargo build --release --bin ai-architect-mcp-codebase --target ${{ matrix.rust_target }}

      - name: Build (macos/windows — vendored static zstd)
        if: ${{ !startsWith(matrix.runner, 'ubuntu') }}
        run: cargo build --release --bin ai-architect-mcp-codebase --target ${{ matrix.rust_target }}

      - name: Strip binary (best-effort)
        run: |
          # matrix.bin_suffix is `.exe` on windows, empty (undefined)
          # elsewhere — GitHub renders undefined matrix keys as "".
          BIN=target/${{ matrix.rust_target }}/release/ai-architect-mcp-codebase${{ matrix.bin_suffix }}
          # GNU strip on Linux, llvm-strip on macOS — both ignore unknown.
          # No strip for MSVC binaries; the `|| true` covers windows too.
          strip "$BIN" 2>/dev/null || true
          ls -la "$BIN"

      - name: Package tarball + sha256
        run: |
          ASSET="ai-architect-mcp-codebase-${{ matrix.target_tag }}.tar.gz"
          BIN=target/${{ matrix.rust_target }}/release/ai-architect-mcp-codebase${{ matrix.bin_suffix }}
          STAGING=$(mktemp -d)
          cp "$BIN" "$STAGING/ai-architect-mcp-codebase${{ matrix.bin_suffix }}"
          tar -C "$STAGING" -czf "$ASSET" ai-architect-mcp-codebase${{ matrix.bin_suffix }}
          # sha256sum (coreutils) covers Linux and Git Bash on windows;
          # shasum covers macOS. windows-latest has NO shasum — the
          # v0.8.1 windows leg exited 127 on it after a successful build.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ASSET" | tee "$ASSET.sha256"
          else
            shasum -a 256 "$ASSET" | tee "$ASSET.sha256"
          fi
          ls -la "$ASSET" "$ASSET.sha256"

      # Provenance BEFORE upload: the attestation binds this exact artifact
      # digest to this workflow, commit and runner. Verify with
      #   gh attestation verify <file> --repo cdeust/ai-architect-mcp-codebase
      - name: Attest build provenance (tarball)
        id: attest_tarball
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ai-architect-mcp-codebase-${{ matrix.target_tag }}.tar.gz

      - name: Stage attestation bundle as a release asset
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_tarball.outputs.bundle-path }}
        run: |
          # The action records the attestation in GitHub's attestation API,
          # which `gh attestation verify` queries — but that leaves NOTHING on
          # the release page. A consumer who downloads the tarball out of band,
          # and OpenSSF Scorecard's Signed-Releases check, both look at the
          # release ASSETS: Signed-Releases scores by the presence of an asset
          # matching *.sigstore.json / *.intoto.jsonl / *.sig / *.asc, so
          # attesting without publishing the bundle scores 0 (docs/checks.md,
          # ossf/scorecard, read 2026-07-28). Publishing the Sigstore bundle
          # next to the artifact makes the signature offline-verifiable.
          BUNDLE="$ATTESTATION_BUNDLE"
          # Git Bash on the windows runner receives a Windows path
          # (D:\a\_temp\...); cygpath normalizes it where it exists and is
          # absent on macOS/Linux, where the path is already POSIX.
          if command -v cygpath >/dev/null 2>&1; then
            BUNDLE="$(cygpath -u "$BUNDLE")"
          fi
          cp "$BUNDLE" "ai-architect-mcp-codebase-${{ matrix.target_tag }}.tar.gz.sigstore.json"
          ls -la "ai-architect-mcp-codebase-${{ matrix.target_tag }}.tar.gz.sigstore.json"

      - name: Upload release assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          # Release was pre-created by the create_release job; we only
          # upload here. tag_name pins the upload to that release so
          # softprops never tries to create a sibling draft.
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ai-architect-mcp-codebase-${{ matrix.target_tag }}.tar.gz
            ai-architect-mcp-codebase-${{ matrix.target_tag }}.tar.gz.sha256
            ai-architect-mcp-codebase-${{ matrix.target_tag }}.tar.gz.sigstore.json
          fail_on_unmatched_files: true

  # SBOM for the whole dependency graph (issue #66). Generated from
  # Cargo.lock, so it describes exactly the versions the release was built
  # from — "what is actually in this binary" is otherwise an unanswerable
  # question for a stripped static Rust binary, which is precisely the
  # question an enterprise reviewer asks (enterprise-backlog#27).
  sbom:
    name: SBOM (CycloneDX)
    needs: create_release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Uploads the SBOM asset and records signed provenance for it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@d1031067263f94b142dd6c0ce24c5eb9d02d52a0 # v1
        with:
          toolchain: "1.95.0"

      - name: Install cargo-cyclonedx
        run: cargo install cargo-cyclonedx --locked --version 0.5.9

      - name: Generate SBOM
        run: |
          cargo cyclonedx --format json --all --override-filename sbom
          # cargo-cyclonedx writes per-manifest files; collect the workspace
          # root one under a predictable release-asset name.
          # -exec rather than `| xargs`: shellcheck SC2038, and a path with a
          # space would silently produce the wrong file.
          find . -maxdepth 3 -name 'sbom.json' -exec cp {} ai-architect-mcp-codebase.cdx.json \; -quit
          ls -la ai-architect-mcp-codebase.cdx.json
          sha256sum ai-architect-mcp-codebase.cdx.json | tee ai-architect-mcp-codebase.cdx.json.sha256

      - name: Attest build provenance (SBOM)
        id: attest_sbom
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ai-architect-mcp-codebase.cdx.json

      # Same reason as the tarball leg: the bundle has to be ON the release
      # for an offline consumer (and Scorecard) to see a signature at all.
      - name: Stage attestation bundle as a release asset
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_sbom.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" ai-architect-mcp-codebase.cdx.json.sigstore.json
          ls -la ai-architect-mcp-codebase.cdx.json.sigstore.json

      - name: Upload SBOM to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ai-architect-mcp-codebase.cdx.json
            ai-architect-mcp-codebase.cdx.json.sha256
            ai-architect-mcp-codebase.cdx.json.sigstore.json
          fail_on_unmatched_files: true

  # Pack and publish the .mcpb bundle after all three platform binaries
  # are available on the GitHub Release. The windows binary is deliberately
  # NOT bundled: .mcpb consumers (Claude Desktop installer
  # contract) only resolve the macos/linux bin/<platform>/ layout today.
  package_mcpb:
    name: package .mcpb bundle
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Uploads the .mcpb asset and records signed provenance for it.
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download platform binaries from release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          for TARGET in macos-aarch64 linux-x86_64 linux-aarch64; do
            ASSET="ai-architect-mcp-codebase-${TARGET}.tar.gz"
            gh release download "$TAG" --repo "$REPOSITORY" \
              --pattern "$ASSET" --pattern "$ASSET.sha256"
            sha256sum --check "$ASSET.sha256"
            gh attestation verify "$ASSET" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG"
          done

      - name: Assemble staging directory
        run: |
          STAGING="$(mktemp -d)/bundle"
          mkdir -p "$STAGING"

          # Static bundle files
          cp manifest.json "$STAGING/"
          cp README.md     "$STAGING/"
          cp LICENSE       "$STAGING/"
          cp PRIVACY.md    "$STAGING/"
          cp mcp-contract.json "$STAGING/"
          cp launch.sh     "$STAGING/"
          chmod +x "$STAGING/launch.sh"

          # icon.png — copy if present (maintainer replaces placeholder)
          if [ -f icon.png ]; then cp icon.png "$STAGING/"; fi

          # Extract platform binaries into bin/<platform>/
          for TARGET in macos-aarch64 linux-x86_64 linux-aarch64; do
            mkdir -p "$STAGING/bin/${TARGET}"
            tar -xzOf "ai-architect-mcp-codebase-${TARGET}.tar.gz" \
              ai-architect-mcp-codebase \
              > "$STAGING/bin/${TARGET}/ai-architect-mcp-codebase"
            chmod +x "$STAGING/bin/${TARGET}/ai-architect-mcp-codebase"
          done

          echo "STAGING=$STAGING" >> "$GITHUB_ENV"

      - name: Pack .mcpb bundle
        run: |
          # .mcpb is a ZIP archive with manifest.json at root. Use the runner's
          # fixed zip tool rather than executing an unpinned package inside the
          # release job immediately before attestation.
          cd "$STAGING"
          zip -r "$OLDPWD/ai-architect-mcp-codebase.mcpb" .
          cd "$OLDPWD"
          shasum -a 256 ai-architect-mcp-codebase.mcpb | tee ai-architect-mcp-codebase.mcpb.sha256
          shasum -a 256 mcp-contract.json | tee mcp-contract.json.sha256
          ls -la ai-architect-mcp-codebase.mcpb ai-architect-mcp-codebase.mcpb.sha256

      - name: Attest build provenance (.mcpb)
        id: attest_mcpb
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ai-architect-mcp-codebase.mcpb

      - name: Attest MCP contract
        id: attest_contract
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: mcp-contract.json

      # Same reason as the tarball leg: the bundle has to be ON the release
      # for an offline consumer (and Scorecard) to see a signature at all.
      - name: Stage attestation bundle as a release asset
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_mcpb.outputs.bundle-path }}
        run: |
          cp "$ATTESTATION_BUNDLE" ai-architect-mcp-codebase.mcpb.sigstore.json
          ls -la ai-architect-mcp-codebase.mcpb.sigstore.json

      - name: Stage MCP contract attestation bundle
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest_contract.outputs.bundle-path }}
        run: cp "$ATTESTATION_BUNDLE" mcp-contract.json.sigstore.json

      - name: Upload .mcpb to release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            ai-architect-mcp-codebase.mcpb
            ai-architect-mcp-codebase.mcpb.sha256
            ai-architect-mcp-codebase.mcpb.sigstore.json
            mcp-contract.json
            mcp-contract.json.sha256
            mcp-contract.json.sigstore.json
          fail_on_unmatched_files: true

  # The plugin bootstrap resolves these public URLs during Claude's MCP
  # handshake. Manifest consistency alone cannot prove that a fresh install is
  # usable, so the release is incomplete until every URL and checksum resolves.
  verify_staged_assets:
    name: verify staged release contract
    needs: [build, sbom, package_mcpb]
    if: github.event_name == 'push'
    outputs:
      checksums: ${{ steps.verify.outputs.checksums }}
      inventory_sha: ${{ steps.verify.outputs.inventory_sha }}
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are visible only to callers with push access. This job
      # does not mutate them, but contents:write is required by GitHub's draft
      # release visibility rule.
      contents: write
      attestations: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Download and verify every launcher asset
        id: verify
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          MANIFEST_VERSION=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          [[ "$MANIFEST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] \
            || { echo "plugin version $MANIFEST_VERSION is not stable SemVer" >&2; exit 1; }
          if [ "$TAG" = "v$MANIFEST_VERSION" ]; then
            :
          elif [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)-rc[0-9]+$ ]] \
            && [ "${BASH_REMATCH[1]}" = "$MANIFEST_VERSION" ]; then
            :
          else
            echo "tag $TAG does not match plugin version $MANIFEST_VERSION" >&2
            exit 1
          fi
          mkdir -p release-assets
          cd release-assets
          for TARGET in macos-aarch64 linux-x86_64 linux-aarch64 windows-x86_64; do
            ASSET="ai-architect-mcp-codebase-${TARGET}.tar.gz"
            gh release download "$TAG" --repo "$REPOSITORY" \
              --pattern "$ASSET" --pattern "$ASSET.sha256" --pattern "$ASSET.sigstore.json"
            sha256sum --check "$ASSET.sha256"
            gh attestation verify "$ASSET" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" \
              --bundle "$ASSET.sigstore.json"
          done
          gh release download "$TAG" --repo "$REPOSITORY" \
            --pattern 'ai-architect-mcp-codebase.mcpb' \
            --pattern 'ai-architect-mcp-codebase.mcpb.sha256' \
            --pattern 'ai-architect-mcp-codebase.mcpb.sigstore.json' \
            --pattern 'ai-architect-mcp-codebase.cdx.json' \
            --pattern 'ai-architect-mcp-codebase.cdx.json.sha256' \
            --pattern 'ai-architect-mcp-codebase.cdx.json.sigstore.json' \
            --pattern 'mcp-contract.json' \
            --pattern 'mcp-contract.json.sha256' \
            --pattern 'mcp-contract.json.sigstore.json'
          sha256sum --check ai-architect-mcp-codebase.mcpb.sha256
          sha256sum --check ai-architect-mcp-codebase.cdx.json.sha256
          sha256sum --check mcp-contract.json.sha256
          gh attestation verify ai-architect-mcp-codebase.mcpb --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" \
            --bundle ai-architect-mcp-codebase.mcpb.sigstore.json
          gh attestation verify ai-architect-mcp-codebase.cdx.json --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" \
            --bundle ai-architect-mcp-codebase.cdx.json.sigstore.json
          gh attestation verify mcp-contract.json --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" \
            --bundle mcp-contract.json.sigstore.json

          EXPECTED=$(printf '%s\n' \
            ai-architect-mcp-codebase-macos-aarch64.tar.gz \
            ai-architect-mcp-codebase-macos-aarch64.tar.gz.sha256 \
            ai-architect-mcp-codebase-macos-aarch64.tar.gz.sigstore.json \
            ai-architect-mcp-codebase-linux-x86_64.tar.gz \
            ai-architect-mcp-codebase-linux-x86_64.tar.gz.sha256 \
            ai-architect-mcp-codebase-linux-x86_64.tar.gz.sigstore.json \
            ai-architect-mcp-codebase-linux-aarch64.tar.gz \
            ai-architect-mcp-codebase-linux-aarch64.tar.gz.sha256 \
            ai-architect-mcp-codebase-linux-aarch64.tar.gz.sigstore.json \
            ai-architect-mcp-codebase-windows-x86_64.tar.gz \
            ai-architect-mcp-codebase-windows-x86_64.tar.gz.sha256 \
            ai-architect-mcp-codebase-windows-x86_64.tar.gz.sigstore.json \
            ai-architect-mcp-codebase.cdx.json \
            ai-architect-mcp-codebase.cdx.json.sha256 \
            ai-architect-mcp-codebase.cdx.json.sigstore.json \
            ai-architect-mcp-codebase.mcpb \
            ai-architect-mcp-codebase.mcpb.sha256 \
            ai-architect-mcp-codebase.mcpb.sigstore.json \
            mcp-contract.json \
            mcp-contract.json.sha256 \
            mcp-contract.json.sigstore.json | sort)
          ACTUAL=$(gh release view "$TAG" --repo "$REPOSITORY" --json assets \
            --jq '.assets[].name' | sort)
          test "$ACTUAL" = "$EXPECTED"
          CHECKSUMS=$(python3 -c 'import glob,json; print(json.dumps({line.split()[1].lstrip("*"): line.split()[0] for path in glob.glob("*.sha256") for line in open(path)}))')
          echo "checksums=$CHECKSUMS" >> "$GITHUB_OUTPUT"
          INVENTORY_SHA=$(printf '%s\n' "$EXPECTED" | sha256sum | awk '{print $1}')
          echo "inventory_sha=$INVENTORY_SHA" >> "$GITHUB_OUTPUT"

  publish_verified_release:
    name: publish verified release
    needs: verify_staged_assets
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish, then verify the anonymous plugin URL
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPOSITORY: ${{ github.repository }}
          VERIFIED_CHECKSUMS: ${{ needs.verify_staged_assets.outputs.checksums }}
          VERIFIED_INVENTORY_SHA: ${{ needs.verify_staged_assets.outputs.inventory_sha }}
        run: |
          set -Eeuo pipefail
          gh release edit "$TAG" --repo "$REPOSITORY" --draft=false
          rollback_required=yes
          rollback() {
            if [ "$rollback_required" = yes ]; then
              gh release edit "$TAG" --repo "$REPOSITORY" --draft=true
            fi
          }
          trap rollback ERR INT TERM
          BASE="https://github.com/${REPOSITORY}/releases/download/${TAG}"
          verify_public_asset() {
            local ASSET=$1
            curl --fail --location --silent --show-error \
              --connect-timeout 5 --max-time 120 --retry 5 --retry-all-errors \
              "$BASE/$ASSET" -o "$ASSET"
            EXPECTED_SHA=$(python3 -c 'import json,os,sys; print(json.loads(os.environ["VERIFIED_CHECKSUMS"])[sys.argv[1]])' "$ASSET")
            ACTUAL_SHA=$(sha256sum "$ASSET" | awk '{print $1}')
            test "$ACTUAL_SHA" = "$EXPECTED_SHA"
            curl --fail --location --silent --show-error \
              --connect-timeout 5 --max-time 60 --retry 5 --retry-all-errors \
              "$BASE/$ASSET.sigstore.json" -o "$ASSET.sigstore.json"
            gh attestation verify "$ASSET" --repo "$REPOSITORY" \
              --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
              --source-ref "refs/tags/$TAG" --bundle "$ASSET.sigstore.json"
          }
          for ASSET in \
            ai-architect-mcp-codebase-macos-aarch64.tar.gz \
            ai-architect-mcp-codebase-linux-x86_64.tar.gz \
            ai-architect-mcp-codebase-linux-aarch64.tar.gz \
            ai-architect-mcp-codebase-windows-x86_64.tar.gz \
            ai-architect-mcp-codebase.mcpb \
            ai-architect-mcp-codebase.cdx.json \
            mcp-contract.json; do
            verify_public_asset "$ASSET"
          done
          ACTUAL_INVENTORY=$(gh release view "$TAG" --repo "$REPOSITORY" --json assets \
            --jq '.assets[].name' | sort)
          ACTUAL_INVENTORY_SHA=$(printf '%s\n' "$ACTUAL_INVENTORY" | sha256sum | awk '{print $1}')
          test "$ACTUAL_INVENTORY_SHA" = "$VERIFIED_INVENTORY_SHA"
          rollback_required=no
          trap - ERR INT TERM

  publish_registry:
    # CONTRIBUTING.md "Releasing". Publishes server.json to the official MCP
    # Registry (registry.modelcontextprotocol.io) after the GitHub Release is
    # public and every asset verified (needs: publish_verified_release), so
    # it can never point the registry at a .mcpb artifact that isn't there.
    # This repo's current io.github.cdeust/ai-architect-mcp-codebase identity
    # (renamed from io.github.cdeust/automatised-pipeline) has never been
    # published under the new name — the registry serves only the old
    # automatised-pipeline entry, frozen at 0.8.4. That gap, not a rebuild
    # defect, is what this job and its workflow_dispatch recovery path close.
    #
    # fileSha256 is a build artifact property (the digest of the zipped
    # .mcpb bundle), not knowable before that bundle is built — the
    # committed server.json therefore carries a placeholder ("000...0") by
    # design rather than by omission. This job computes the real digest from
    # the public, checksum- and attestation-verified release asset and
    # patches a RUNTIME copy of server.json before publishing; the committed
    # file is never rewritten. version/identifier are still asserted to
    # match the tag being published, so a stale commit fails loudly instead
    # of silently publishing the wrong metadata.
    name: Publish server.json to the MCP Registry
    needs:
      [
        create_release,
        build,
        sbom,
        package_mcpb,
        verify_staged_assets,
        publish_verified_release,
      ]
    if: |
      always() &&
      (github.event_name == 'workflow_dispatch' || needs.publish_verified_release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # OIDC token the MCP Registry exchanges for a publish credential
    steps:
      # Fail loudly rather than silently skip: workflow_dispatch without an
      # explicit tag would otherwise publish whatever ref happened to be
      # selected in the UI, which is exactly the kind of unattended drift
      # this job exists to close.
      - name: Resolve target tag
        id: resolve
        run: |
          set -euxo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            if [ -z "$TAG" ]; then
              echo "::error::workflow_dispatch requires a 'tag' input (e.g. v0.9.1) — refusing to guess which release to publish."
              exit 1
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Verify server.json version matches the tag being published
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          PKG_VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          [ "$TAG" = "v$VERSION" ] || { echo "::error::server.json version $VERSION does not match tag $TAG" >&2; exit 1; }
          [ "$VERSION" = "$PKG_VERSION" ] || { echo "::error::server.json top-level version $VERSION != packages[0].version $PKG_VERSION" >&2; exit 1; }
          IDENTIFIER=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['identifier'])")
          case "$IDENTIFIER" in
            *"/releases/download/$TAG/"*) : ;;
            *) echo "::error::server.json packages[0].identifier ($IDENTIFIER) does not reference tag $TAG" >&2; exit 1 ;;
          esac

      # The exact defect this job exists to prevent runs in both directions:
      # a registry entry must never point at a release asset that does not
      # exist or is not yet public. Download from the public release (not
      # draft — publish_verified_release already flipped that), verify its
      # checksum and provenance attestation exactly as the release workflow
      # itself does, then use ITS digest — never a value taken on trust from
      # the committed file.
      - name: Download and verify the public .mcpb asset
        id: mcpb
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.resolve.outputs.tag }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --repo "$REPOSITORY" \
            --pattern 'ai-architect-mcp-codebase.mcpb' \
            --pattern 'ai-architect-mcp-codebase.mcpb.sha256' \
            --pattern 'ai-architect-mcp-codebase.mcpb.sigstore.json'
          sha256sum --check ai-architect-mcp-codebase.mcpb.sha256
          gh attestation verify ai-architect-mcp-codebase.mcpb --repo "$REPOSITORY" \
            --signer-workflow "$REPOSITORY/.github/workflows/release.yml" \
            --source-ref "refs/tags/$TAG" \
            --bundle ai-architect-mcp-codebase.mcpb.sigstore.json
          DIGEST=$(sha256sum ai-architect-mcp-codebase.mcpb | awk '{print $1}')
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"

      # mcp-publisher has no first-party GitHub Action wrapper, so it is
      # fetched as a release binary and checksum-verified against the
      # registry project's own published checksums — the same supply-chain
      # discipline the pinned Actions above get via commit SHA, applied to a
      # raw binary download. Bump both MCP_PUBLISHER_VERSION and the SHA-256
      # together from https://github.com/modelcontextprotocol/registry/releases.
      - name: Install mcp-publisher (checksum-verified)
        env:
          MCP_PUBLISHER_VERSION: v1.8.1
          MCP_PUBLISHER_SHA256: a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc
        run: |
          set -euxo pipefail
          curl -fsSLO "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          echo "${MCP_PUBLISHER_SHA256}  mcp-publisher_linux_amd64.tar.gz" | sha256sum -c -
          tar xzf mcp-publisher_linux_amd64.tar.gz mcp-publisher
          chmod +x mcp-publisher

      # Patch a RUNTIME copy — the committed server.json keeps its
      # placeholder fileSha256 (see the job header comment above for why
      # that is by design, not a bug left unfixed).
      - name: Patch fileSha256 into a runtime copy of server.json
        env:
          DIGEST: ${{ steps.mcpb.outputs.digest }}
        run: |
          set -euo pipefail
          python3 -c "import json, os; d = json.load(open('server.json')); d['packages'][0]['fileSha256'] = os.environ['DIGEST']; json.dump(d, open('server.runtime.json', 'w'), indent=2)"
          cat server.runtime.json

      # No secret: the OIDC pattern this job uses has no PyPI-Trusted-
      # Publishing equivalent in THIS repo (it ships an mcpb binary, not a
      # PyPI package) — it is the MCP Registry's own no-long-lived-
      # credential mechanism. `mcp-publisher login github-oidc` exchanges
      # this job's GitHub Actions OIDC token for a registry credential
      # scoped to io.github.cdeust/*, using only the id-token: write
      # permission above.
      # Source: modelcontextprotocol/registry docs/reference/cli/commands.md
      # ("GitHub OIDC (CI/CD)") and docs/modelcontextprotocol-io/github-actions.mdx
      # ("OIDC authentication (recommended)"), verified 2026-08-10.
      - name: Authenticate to the MCP Registry via GitHub OIDC
        run: ./mcp-publisher login github-oidc

      - name: Publish server.json to the MCP Registry
        run: ./mcp-publisher publish server.runtime.json

      # A green `mcp-publisher publish` is not proof. Query the registry's
      # own API and fail the job if it disagrees with what was published.
      - name: Verify the registry now serves the published version
        env:
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euxo pipefail
          VERSION=$(python3 -c "import json; print(json.load(open('server.runtime.json'))['version'])")
          ACTUAL=$(curl -fsSL "https://registry.modelcontextprotocol.io/v0/servers?search=ai-architect-mcp-codebase" \
            | python3 -c "import json, sys; d = json.load(sys.stdin); latest = next(s for s in d['servers'] if s['server']['name'] == 'io.github.cdeust/ai-architect-mcp-codebase' and s['_meta']['io.modelcontextprotocol.registry/official']['isLatest']); print(latest['server']['version'])")
          echo "Registry reports latest version: ${ACTUAL} (expected ${VERSION})"
          if [ "$ACTUAL" != "$VERSION" ]; then
            echo "::error::MCP Registry serves ${ACTUAL}, expected ${VERSION} after publish"
            exit 1
          fi
